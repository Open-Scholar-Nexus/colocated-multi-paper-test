version: 1

# Your paper's metadata. Fill in the form below; do not add `extends:`.
# https://scholar.nexus/oaktree-sapling/start/paper
project:
  # A fresh id, unique in this journal. The build rejects this placeholder.
  # https://scholar.nexus/oaktree-sapling/guide/journal-yml#id-pattern
  id: alpha-2026-tidal-flats
  title: Sediment transport on tidal flats
  github: https://github.com/Open-Scholar-Nexus/colocated-multi-paper-test
  authors:
    - name: Josiah Carberry
      orcid: 0000-0002-1825-0097
      affiliations:
        - Brown University
      roles:
        - conceptualization
        - writing - original draft
  keywords:
    - tidal flats
    - sediment
  # authors:
  #   - name: Ada Lovelace
  #     orcid: 0000-0000-0000-0000
  #     affiliations:
  #       - Your Institution
  #     email: you@example.org
  #     corresponding: true
  #     roles:
  #       - conceptualization
  #       - writing - original draft
  # keywords:
  #   - keyword one
  #   - keyword two
  # thumbnails/thumbnail.png is the picture on the journal's paper list; replace the grey one.
  bibliography:
    - bib.bib
  options:
    # written by `oak bootstrap` and `oak upgrade`.
    # this is what tells oaktree-sapling where to look for
    # your journal's configuration
    oaktree-sapling:
      version: v0.4.0-dev.2
      edition: "2026"
